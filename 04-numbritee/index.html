<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbritee</title>
</head>
<body>
<h1>Numbritee</h1>

<!-- Puhas mänguloogika: ilma DOM-ita, testitav käsuga `node test.mjs`. -->
<script id="logic">
// Numbrite arv K ruudustiku suuruse N järgi (spec F2).
const K_BY_N = { 5: 6, 6: 9, 7: 12, 8: 15 };

function kFor(N) {
  const K = K_BY_N[N];
  if (K === undefined) throw new RangeError(`N peab olema 5–8, sain ${N}`);
  return K;
}

// Seemnega juhuarvude generaator (mulberry32) testide jaoks. Tagastab funktsiooni → [0, 1).
function seededRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const randInt = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1)); // kaasa arvatud mõlemad otsad

// Ruut = indeks i = rida * N + veerg. Tagastab naaberruudud (üles/alla/vasakule/paremale).
function neighbors(N, i) {
  const r = Math.floor(i / N), c = i % N, out = [];
  if (r > 0) out.push(i - N);
  if (r < N - 1) out.push(i + N);
  if (c > 0) out.push(i - 1);
  if (c < N - 1) out.push(i + 1);
  return out;
}

// Juhuslik tee, mis läbib kõik N² ruutu (Hamiltoni tee): maokujuline algus + backbite-sammud.
function randomFullPath(N, rng) {
  const M = N * N;
  const path = [];
  for (let r = 0; r < N; r++) {
    for (let k = 0; k < N; k++) path.push(r * N + (r % 2 === 0 ? k : N - 1 - k));
  }
  const pos = new Array(M);
  const reindex = (from) => { for (let k = from; k < M; k++) pos[path[k]] = k; };
  const reverseFrom = (from) => {
    for (let a = from, b = M - 1; a < b; a++, b--) [path[a], path[b]] = [path[b], path[a]];
    reindex(from);
  };
  reindex(0);

  const steps = M * 20;
  for (let s = 0; s < steps; s++) {
    if (rng() < 0.5) reverseFrom(0); // backbite kord ühest, kord teisest otsast
    const end = path[M - 1];
    const nb = neighbors(N, end);
    const v = nb[Math.floor(rng() * nb.length)];
    const j = pos[v];
    if (j === M - 2) continue; // v on juba tee naaber
    reverseFrom(j + 1); // serv v–path[j+1] kaob, tekib serv v–end
  }
  if (rng() < 0.5) reverseFrom(0);
  return path;
}

// Uus mäng (F2): lahendustee + numbrid 1…K selle peal.
// numberAt[ruut] = number või 0. numberPos[n] = numbri n indeks lahendusteel.
function generatePuzzle(N, rng = Math.random) {
  const K = kFor(N);
  const M = N * N;
  const solution = randomFullPath(N, rng);

  const stepLen = (M - 1) / (K - 1);
  const jitter = Math.floor(stepLen / 3); // tagab naabernumbrite vahe ≥ 2 kõigil N = 5–8
  const numberPos = [undefined];
  for (let n = 1; n <= K; n++) {
    const base = Math.round((n - 1) * stepLen);
    numberPos.push(n === 1 || n === K ? base : base + randInt(rng, -jitter, jitter));
  }

  const numberAt = new Array(M).fill(0);
  for (let n = 1; n <= K; n++) numberAt[solution[numberPos[n]]] = n;
  return { N, K, solution, numberAt, numberPos };
}

// --- Mängu olek ja reeglid (F3, F4, F6, F8, F10) ---
// Olek on muutumatu: iga funktsioon tagastab uue objekti või sama objekti, kui midagi ei muutunud.
// path[0] on alati ruut „1“. Tee pikkus (sammud) = path.length − 1.
// reached = suurim number, mis teel on. started = kas esimene käik on tehtud (taimer, F7).

function newState(puzzle) {
  return { puzzle, path: [puzzle.solution[0]], reached: 1, undos: 0, hints: 0, won: false, started: false };
}

const tail = (state) => state.path[state.path.length - 1];
const isAdjacent = (N, a, b) =>
  Math.abs(Math.floor(a / N) - Math.floor(b / N)) + Math.abs((a % N) - (b % N)) === 1;

function canExtend(state, cell) {
  const { N, K, numberAt } = state.puzzle;
  if (state.won) return false;
  if (numberAt[tail(state)] === K) return false; // ruudust K ei saa edasi (F4)
  if (!isAdjacent(N, tail(state), cell)) return false; // ainult naaberruut, mitte diagonaal (F3)
  if (state.path.includes(cell)) return false; // iga ruut üks kord (F3)
  const n = numberAt[cell];
  return n === 0 || n === state.reached + 1; // number ainult järjekorras (F4)
}

function isWon(state) {
  const { N, K, numberAt } = state.puzzle;
  return state.path.length === N * N && numberAt[tail(state)] === K;
}

function extend(state, cell) {
  if (!canExtend(state, cell)) return state;
  const n = state.puzzle.numberAt[cell];
  const next = { ...state, path: [...state.path, cell], reached: n || state.reached, started: true };
  next.won = isWon(next);
  return next;
}

// Viimase sammu eemaldamine (F6). Tühjal teel või pärast võitu ei tee midagi.
function undo(state) {
  if (state.won || state.path.length <= 1) return state;
  const removed = tail(state);
  const n = state.puzzle.numberAt[removed];
  return { ...state, path: state.path.slice(0, -1), reached: n ? n - 1 : state.reached, undos: state.undos + 1 };
}

// Lohistamine ruudule (F5): liigub tee otsast sihtruudu poole samm-sammult, kui siht on samas reas või veerus.
// Iga samm: eelviimane teeruut → tagasivõtt (loeb tagasivõtteks), muidu → pikendamine.
// Esimene keelatud samm peatab liikumise. Diagonaalne või muu hüpe → olek ei muutu.
function dragTo(state, cell) {
  if (state.won) return state;
  const { N } = state.puzzle;
  const t = tail(state);
  const dr = Math.floor(cell / N) - Math.floor(t / N);
  const dc = (cell % N) - (t % N);
  if ((dr !== 0 && dc !== 0) || (dr === 0 && dc === 0)) return state;
  const step = dr !== 0 ? Math.sign(dr) * N : Math.sign(dc);
  const count = Math.abs(dr + dc);
  let s = state;
  for (let k = 0; k < count; k++) {
    const c = tail(s) + step;
    const penult = s.path.length >= 2 ? s.path[s.path.length - 2] : -1;
    const next = c === penult ? undo(s) : extend(s, c);
    if (next === s) break;
    s = next;
  }
  return s;
}

// Vihje (F9). Viimane õige ruut = mängija tee ja lahendustee pikima ühise alguse viimane ruut.
// Pikem tee lõigatakse sinna ilma tagasivõtete trahvita. target = järgmine ruut, mida UI vilgutab.
// Vihje käivitab taimeri (started). Võidu järel ei tee midagi (target = null).
function hint(state) {
  if (state.won) return { state, target: null };
  const { solution, numberAt } = state.puzzle;
  let L = 1;
  while (L < state.path.length && state.path[L] === solution[L]) L++;
  const path = state.path.slice(0, L);
  const reached = Math.max(...path.map((c) => numberAt[c]));
  return {
    state: { ...state, path, reached, hints: state.hints + 1, started: true },
    target: solution[L],
  };
}

// „Alusta uuesti“ (F10): sama mäng, tühi tee ja nullis loendurid.
const restart = (state) => newState(state.puzzle);

// Viimane avaldis = loogika avalik liides (test.mjs loeb selle vm-i tulemusena).
const Logic = {
  K_BY_N, kFor, seededRng, neighbors, generatePuzzle,
  newState, tail, canExtend, extend, undo, isWon, restart, dragTo, hint,
};
Logic;
</script>
