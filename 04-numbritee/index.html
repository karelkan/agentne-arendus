<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbritee</title>
</head>
<body>
<h1>Numbritee</h1>

<!-- Puhas mänguloogika: ilma DOM-ita, testitav käsuga `node test.mjs`. -->
<script id="logic">
// Numbrite arv K ruudustiku suuruse N järgi (spec F2).
const K_BY_N = { 5: 6, 6: 9, 7: 12, 8: 15 };

function kFor(N) {
  const K = K_BY_N[N];
  if (K === undefined) throw new RangeError(`N peab olema 5–8, sain ${N}`);
  return K;
}

// Seemnega juhuarvude generaator (mulberry32) testide jaoks. Tagastab funktsiooni → [0, 1).
function seededRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const randInt = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1)); // kaasa arvatud mõlemad otsad

// Ruut = indeks i = rida * N + veerg. Tagastab naaberruudud (üles/alla/vasakule/paremale).
function neighbors(N, i) {
  const r = Math.floor(i / N), c = i % N, out = [];
  if (r > 0) out.push(i - N);
  if (r < N - 1) out.push(i + N);
  if (c > 0) out.push(i - 1);
  if (c < N - 1) out.push(i + 1);
  return out;
}

// Juhuslik tee, mis läbib kõik N² ruutu (Hamiltoni tee): maokujuline algus + backbite-sammud.
function randomFullPath(N, rng) {
  const M = N * N;
  const path = [];
  for (let r = 0; r < N; r++) {
    for (let k = 0; k < N; k++) path.push(r * N + (r % 2 === 0 ? k : N - 1 - k));
  }
  const pos = new Array(M);
  const reindex = (from) => { for (let k = from; k < M; k++) pos[path[k]] = k; };
  const reverseFrom = (from) => {
    for (let a = from, b = M - 1; a < b; a++, b--) [path[a], path[b]] = [path[b], path[a]];
    reindex(from);
  };
  reindex(0);

  const steps = M * 20;
  for (let s = 0; s < steps; s++) {
    if (rng() < 0.5) reverseFrom(0); // backbite kord ühest, kord teisest otsast
    const end = path[M - 1];
    const nb = neighbors(N, end);
    const v = nb[Math.floor(rng() * nb.length)];
    const j = pos[v];
    if (j === M - 2) continue; // v on juba tee naaber
    reverseFrom(j + 1); // serv v–path[j+1] kaob, tekib serv v–end
  }
  if (rng() < 0.5) reverseFrom(0);
  return path;
}

// Uus mäng (F2): lahendustee + numbrid 1…K selle peal.
// numberAt[ruut] = number või 0. numberPos[n] = numbri n indeks lahendusteel.
function generatePuzzle(N, rng = Math.random) {
  const K = kFor(N);
  const M = N * N;
  const solution = randomFullPath(N, rng);

  const stepLen = (M - 1) / (K - 1);
  const jitter = Math.floor(stepLen / 3); // tagab naabernumbrite vahe ≥ 2 kõigil N = 5–8
  const numberPos = [undefined];
  for (let n = 1; n <= K; n++) {
    const base = Math.round((n - 1) * stepLen);
    numberPos.push(n === 1 || n === K ? base : base + randInt(rng, -jitter, jitter));
  }

  const numberAt = new Array(M).fill(0);
  for (let n = 1; n <= K; n++) numberAt[solution[numberPos[n]]] = n;
  return { N, K, solution, numberAt, numberPos };
}

// Viimane avaldis = loogika avalik liides (test.mjs loeb selle vm-i tulemusena).
const Logic = { K_BY_N, kFor, seededRng, neighbors, generatePuzzle };
Logic;
</script>
