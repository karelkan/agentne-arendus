<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbritee</title>
<style>
  :root {
    --bg: #f6f5f1; --fg: #1d1d1f; --muted: #6b6b70;
    --cell: #ffffff; --line: #d9d7d0; --visited: #dce8fb;
    --path: #2f6fdf; --num-bg: #1d1d1f; --num-fg: #ffffff; --num-done: #2f6fdf;
    --hint: #e8a317; --btn: #ffffff; --btn-fg: #1d1d1f; --win: #e3f4e6; --win-fg: #1e5b2b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151517; --fg: #ececee; --muted: #9a9aa2;
      --cell: #222226; --line: #36363c; --visited: #1f3256;
      --path: #6b9bff; --num-bg: #ececee; --num-fg: #151517; --num-done: #6b9bff;
      --hint: #f2b53a; --btn: #2a2a2f; --btn-fg: #ececee; --win: #1d3a24; --win-fg: #b8e6c1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main {
    --size: max(240px, min(calc(100vw - 32px), calc(100dvh - 310px), 520px));
    max-width: 560px; margin: 0 auto; padding: 16px;
    display: grid; gap: 12px; justify-items: center;
  }
  header { text-align: center; }
  h1 { margin: 0; font-size: 1.5rem; }
  .rules { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .stats { font-variant-numeric: tabular-nums; color: var(--muted); gap: 4px 16px; }
  .stats b { color: var(--fg); font-weight: 600; }
  button, select {
    font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--btn); color: var(--btn-fg); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }

  .board-wrap { position: relative; isolation: isolate; width: var(--size); height: var(--size); touch-action: none; user-select: none; -webkit-user-select: none; }
  .grid { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr)); width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .cell { display: flex; align-items: center; justify-content: center; background: var(--cell); border: 1px solid var(--line); margin: -0.5px; transition: background .12s; }
  .cell.visited { background: var(--visited); }
  .cell.hint { animation: blink .5s ease-in-out 3; }
  @keyframes blink { 50% { background: var(--hint); } }
  .board-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .num {
    position: relative; z-index: 2; width: 62%; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; background: var(--num-bg); color: var(--num-fg);
    font-weight: 700; font-size: calc(var(--size) / var(--n) * .34); pointer-events: none;
  }
  .num.done { background: var(--num-done); color: #fff; }

  .win { background: var(--win); color: var(--win-fg); padding: 10px 16px; border-radius: 8px; text-align: center; }
  .win[hidden] { display: none; }

  /* Telefon rõhtpaigutuses: ruudustik vasakul, juhtnupud paremal (M5). */
  @media (orientation: landscape) and (max-height: 560px) {
    main {
      --size: min(calc(100dvh - 32px), 55vw);
      max-width: none; grid-template-columns: auto minmax(0, 320px); justify-content: center; align-items: center;
    }
    .board-wrap { grid-row: 1 / span 5; grid-column: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Numbritee</h1>
    <p class="rules">Lohista ruudust 1: ühenda numbrid järjekorras ja läbi iga ruut täpselt üks kord.</p>
  </header>
  <div class="row">
    <label>Suurus
      <select id="size">
        <option value="5">5 × 5</option>
        <option value="6" selected>6 × 6</option>
        <option value="7">7 × 7</option>
        <option value="8">8 × 8</option>
      </select>
    </label>
    <button id="new">Uus mäng</button>
  </div>
  <div class="row stats" aria-live="polite">
    <span>Aeg: <b id="time">0:00</b></span>
    <span>Tagasivõtted: <b id="undos">0</b></span>
    <span>Vihjed: <b id="hints">0</b></span>
    <span>Parim: <b id="best">–</b></span>
  </div>
  <div class="board-wrap" id="board">
    <div class="grid" id="grid"></div>
    <svg id="line" aria-hidden="true"></svg>
  </div>
  <div class="row">
    <button id="undo">Tagasi</button>
    <button id="hint">Vihje</button>
    <button id="restart">Alusta uuesti</button>
  </div>
  <div class="win" id="win" role="status" hidden></div>
</main>

<!-- Puhas mänguloogika: ilma DOM-ita, testitav käsuga `node test.mjs`. -->
<script id="logic">
// Numbrite arv K ruudustiku suuruse N järgi (spec F2).
const K_BY_N = { 5: 6, 6: 9, 7: 12, 8: 15 };

function kFor(N) {
  const K = K_BY_N[N];
  if (K === undefined) throw new RangeError(`N peab olema 5–8, sain ${N}`);
  return K;
}

// Seemnega juhuarvude generaator (mulberry32) testide jaoks. Tagastab funktsiooni → [0, 1).
function seededRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const randInt = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1)); // kaasa arvatud mõlemad otsad

// Ruut = indeks i = rida * N + veerg. Tagastab naaberruudud (üles/alla/vasakule/paremale).
function neighbors(N, i) {
  const r = Math.floor(i / N), c = i % N, out = [];
  if (r > 0) out.push(i - N);
  if (r < N - 1) out.push(i + N);
  if (c > 0) out.push(i - 1);
  if (c < N - 1) out.push(i + 1);
  return out;
}

// Juhuslik tee, mis läbib kõik N² ruutu (Hamiltoni tee): maokujuline algus + backbite-sammud.
function randomFullPath(N, rng) {
  const M = N * N;
  const path = [];
  for (let r = 0; r < N; r++) {
    for (let k = 0; k < N; k++) path.push(r * N + (r % 2 === 0 ? k : N - 1 - k));
  }
  const pos = new Array(M);
  const reindex = (from) => { for (let k = from; k < M; k++) pos[path[k]] = k; };
  const reverseFrom = (from) => {
    for (let a = from, b = M - 1; a < b; a++, b--) [path[a], path[b]] = [path[b], path[a]];
    reindex(from);
  };
  reindex(0);

  const steps = M * 20;
  for (let s = 0; s < steps; s++) {
    if (rng() < 0.5) reverseFrom(0); // backbite kord ühest, kord teisest otsast
    const end = path[M - 1];
    const nb = neighbors(N, end);
    const v = nb[Math.floor(rng() * nb.length)];
    const j = pos[v];
    if (j === M - 2) continue; // v on juba tee naaber
    reverseFrom(j + 1); // serv v–path[j+1] kaob, tekib serv v–end
  }
  if (rng() < 0.5) reverseFrom(0);
  return path;
}

// Uus mäng (F2): lahendustee + numbrid 1…K selle peal.
// numberAt[ruut] = number või 0. numberPos[n] = numbri n indeks lahendusteel.
function generatePuzzle(N, rng = Math.random) {
  const K = kFor(N);
  const M = N * N;
  const solution = randomFullPath(N, rng);

  const stepLen = (M - 1) / (K - 1);
  const jitter = Math.floor(stepLen / 3); // tagab naabernumbrite vahe ≥ 2 kõigil N = 5–8
  const numberPos = [undefined];
  for (let n = 1; n <= K; n++) {
    const base = Math.round((n - 1) * stepLen);
    numberPos.push(n === 1 || n === K ? base : base + randInt(rng, -jitter, jitter));
  }

  const numberAt = new Array(M).fill(0);
  for (let n = 1; n <= K; n++) numberAt[solution[numberPos[n]]] = n;
  return { N, K, solution, numberAt, numberPos };
}

// --- Mängu olek ja reeglid (F3, F4, F6, F8, F10) ---
// Olek on muutumatu: iga funktsioon tagastab uue objekti või sama objekti, kui midagi ei muutunud.
// path[0] on alati ruut „1“. Tee pikkus (sammud) = path.length − 1.
// reached = suurim number, mis teel on. started = kas esimene käik on tehtud (taimer, F7).

function newState(puzzle) {
  return { puzzle, path: [puzzle.solution[0]], reached: 1, undos: 0, hints: 0, won: false, started: false };
}

const tail = (state) => state.path[state.path.length - 1];
const isAdjacent = (N, a, b) =>
  Math.abs(Math.floor(a / N) - Math.floor(b / N)) + Math.abs((a % N) - (b % N)) === 1;

function canExtend(state, cell) {
  const { N, K, numberAt } = state.puzzle;
  if (state.won) return false;
  if (numberAt[tail(state)] === K) return false; // ruudust K ei saa edasi (F4)
  if (!isAdjacent(N, tail(state), cell)) return false; // ainult naaberruut, mitte diagonaal (F3)
  if (state.path.includes(cell)) return false; // iga ruut üks kord (F3)
  const n = numberAt[cell];
  return n === 0 || n === state.reached + 1; // number ainult järjekorras (F4)
}

function isWon(state) {
  const { N, K, numberAt } = state.puzzle;
  return state.path.length === N * N && numberAt[tail(state)] === K;
}

function extend(state, cell) {
  if (!canExtend(state, cell)) return state;
  const n = state.puzzle.numberAt[cell];
  const next = { ...state, path: [...state.path, cell], reached: n || state.reached, started: true };
  next.won = isWon(next);
  return next;
}

// Viimase sammu eemaldamine (F6). Tühjal teel või pärast võitu ei tee midagi.
function undo(state) {
  if (state.won || state.path.length <= 1) return state;
  const removed = tail(state);
  const n = state.puzzle.numberAt[removed];
  return { ...state, path: state.path.slice(0, -1), reached: n ? n - 1 : state.reached, undos: state.undos + 1 };
}

// Lohistamine ruudule (F5): liigub tee otsast sihtruudu poole samm-sammult, kui siht on samas reas või veerus.
// Iga samm: eelviimane teeruut → tagasivõtt (loeb tagasivõtteks), muidu → pikendamine.
// Esimene keelatud samm peatab liikumise. Diagonaalne või muu hüpe → olek ei muutu.
function dragTo(state, cell) {
  if (state.won) return state;
  const { N } = state.puzzle;
  const t = tail(state);
  const dr = Math.floor(cell / N) - Math.floor(t / N);
  const dc = (cell % N) - (t % N);
  if ((dr !== 0 && dc !== 0) || (dr === 0 && dc === 0)) return state;
  const step = dr !== 0 ? Math.sign(dr) * N : Math.sign(dc);
  const count = Math.abs(dr + dc);
  let s = state;
  for (let k = 0; k < count; k++) {
    const c = tail(s) + step;
    const penult = s.path.length >= 2 ? s.path[s.path.length - 2] : -1;
    const next = c === penult ? undo(s) : extend(s, c);
    if (next === s) break;
    s = next;
  }
  return s;
}

// Vihje (F9). Viimane õige ruut = mängija tee ja lahendustee pikima ühise alguse viimane ruut.
// Pikem tee lõigatakse sinna ilma tagasivõtete trahvita. target = järgmine ruut, mida UI vilgutab.
// Vihje käivitab taimeri (started). Võidu järel ei tee midagi (target = null).
function hint(state) {
  if (state.won) return { state, target: null };
  const { solution, numberAt } = state.puzzle;
  let L = 1;
  while (L < state.path.length && state.path[L] === solution[L]) L++;
  const path = state.path.slice(0, L);
  const reached = Math.max(...path.map((c) => numberAt[c]));
  return {
    state: { ...state, path, reached, hints: state.hints + 1, started: true },
    target: solution[L],
  };
}

// „Alusta uuesti“ (F10): sama mäng, tühi tee ja nullis loendurid.
const restart = (state) => newState(state.puzzle);

// Viimane avaldis = loogika avalik liides (test.mjs loeb selle vm-i tulemusena).
const Logic = {
  K_BY_N, kFor, seededRng, neighbors, generatePuzzle,
  newState, tail, canExtend, extend, undo, isWon, restart, dragTo, hint,
};
Logic;
</script>

<!-- Kasutajaliides. -->
<script id="ui">
const $ = (id) => document.getElementById(id);
const el = {
  size: $('size'), board: $('board'), grid: $('grid'), line: $('line'), win: $('win'),
  time: $('time'), undos: $('undos'), hints: $('hints'), best: $('best'),
  undo: $('undo'), hint: $('hint'), restart: $('restart'), newGame: $('new'),
};
const SVG_NS = 'http://www.w3.org/2000/svg';

let state;          // mängu olek (Logic)
let cells = [];     // ruutude DOM-elemendid indeksi järgi
let startTime = null, endTime = null, timerId = null, hintTimer = null, dragging = false;

const fmt = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const elapsed = () => (startTime === null ? 0 : (endTime ?? performance.now()) - startTime);

// --- Parim aeg (F11): localStorage võib puududa või visata vea, siis töötab mäng ilma selleta ---
const bestKey = (N) => `numbritee.best.${N}`;
function loadBest(N) {
  try { const v = localStorage.getItem(bestKey(N)); return v ? Number(v) : null; } catch { return null; }
}
function saveBest(N, ms) {
  try { localStorage.setItem(bestKey(N), String(Math.round(ms))); } catch { /* ignoreeri */ }
}

// --- Mängu alustamine ---
function newGame() {
  setup(Logic.newState(Logic.generatePuzzle(Number(el.size.value))));
}

function setup(s) {
  state = s;
  clearInterval(timerId);
  startTime = endTime = timerId = null;
  el.win.hidden = true;
  buildBoard();
  render();
}

function buildBoard() {
  const { N, numberAt } = state.puzzle;
  el.board.style.setProperty('--n', N);
  el.grid.replaceChildren();
  cells = [];
  for (let i = 0; i < N * N; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.i = i;
    if (numberAt[i]) {
      const n = document.createElement('span');
      n.className = 'num';
      n.textContent = numberAt[i];
      c.append(n);
    }
    el.grid.append(c);
    cells.push(c);
  }
  el.line.setAttribute('viewBox', `0 0 ${N} ${N}`);
}

// --- Oleku muutmine ja joonistamine ---
function setState(next) {
  if (next === state) return;
  const prev = state;
  state = next;
  if (!prev.started && next.started) startTimer();
  if (!prev.won && next.won) onWin();
  render();
}

function render() {
  const { N, numberAt } = state.puzzle;
  const onPath = new Set(state.path);
  cells.forEach((c, i) => {
    c.classList.toggle('visited', onPath.has(i));
    const num = c.firstElementChild;
    if (num) num.classList.toggle('done', onPath.has(i) && numberAt[i] <= state.reached);
  });

  // Tee joon ja teeotsa täpp (SVG, koordinaadid ruutudes)
  const pt = (i) => [(i % N) + 0.5, Math.floor(i / N) + 0.5];
  const points = state.path.map((i) => pt(i).join(',')).join(' ');
  const [tx, ty] = pt(Logic.tail(state));
  el.line.innerHTML =
    `<polyline points="${points}" fill="none" stroke="var(--path)" stroke-width="0.28" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>` +
    `<circle cx="${tx}" cy="${ty}" r="0.22" fill="var(--path)"/>`;

  el.undos.textContent = state.undos;
  el.hints.textContent = state.hints;
  el.time.textContent = fmt(elapsed());
  const best = loadBest(N);
  el.best.textContent = best === null ? '–' : fmt(best);
  el.undo.disabled = state.won || state.path.length <= 1;
  el.hint.disabled = state.won;
}

// --- Taimer (F7) ja võit (F8) ---
function startTimer() {
  startTime = performance.now();
  timerId = setInterval(() => { el.time.textContent = fmt(elapsed()); }, 250);
}

function onWin() {
  endTime = performance.now();
  clearInterval(timerId);
  const ms = elapsed();
  const { N } = state.puzzle;
  let record = '';
  if (state.hints === 0) {
    const best = loadBest(N);
    if (best === null || ms < best) { saveBest(N, ms); record = ' Uus rekord!'; }
  }
  el.win.textContent =
    `Võit! Aeg ${fmt(ms)} · tagasivõtted ${state.undos} · vihjed ${state.hints}.${record}`;
  el.win.hidden = false;
}

// --- Lohistamine (F5): algab ainult tee otsast, ruut leitakse sõrme/hiire asukohast ---
function cellAt(e) {
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const c = hit && hit.closest('.cell');
  return c && el.grid.contains(c) ? Number(c.dataset.i) : null;
}

el.board.addEventListener('pointerdown', (e) => {
  if (state.won || cellAt(e) !== Logic.tail(state)) return;
  dragging = true;
  try { el.board.setPointerCapture(e.pointerId); } catch { /* sünteetiline sündmus testis */ }
  e.preventDefault();
});
el.board.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const i = cellAt(e);
  if (i !== null) setState(Logic.dragTo(state, i));
});
const stopDrag = () => { dragging = false; };
el.board.addEventListener('pointerup', stopDrag);
el.board.addEventListener('pointercancel', stopDrag);

// --- Nupud ---
el.newGame.addEventListener('click', newGame);
el.size.addEventListener('change', newGame);
el.restart.addEventListener('click', () => setup(Logic.restart(state)));
el.undo.addEventListener('click', () => setState(Logic.undo(state)));
el.hint.addEventListener('click', () => {
  const { state: next, target } = Logic.hint(state);
  setState(next);
  if (target === null) return;
  // Vihje vilgub ~1,5 s (3 × 0,5 s animatsioon), siis kaob (F9)
  clearTimeout(hintTimer);
  cells.forEach((c) => c.classList.remove('hint'));
  const c = cells[target];
  void c.offsetWidth; // taaskäivita animatsioon
  c.classList.add('hint');
  hintTimer = setTimeout(() => c.classList.remove('hint'), 1500);
});

newGame(); // lehe avamisel kohe mäng N=6 (F1)
</script>
</body>
</html>
